api_version: "v1"
base_prefix: "/api/v1"
endpoints:
  folder_scaffold:
    base: "/folder-scaffold"
    create_file: "/create-file"
    link_files: "/link-files"
    scaffold_feature: "/scaffold-feature"
    scaffold_package: "/scaffold-package"
  health:
    base: "/health"
    live: "/health/live"
    ready: "/health/ready"
  system:
    base: ""
    health: "/health"
upstream_services:
  alloydb:
    health_endpoint: "/health"
    timeout_seconds: 5
  neo4j:
    commit_endpoint: "/db/neo4j/tx/commit"
    timeout_seconds: 30
