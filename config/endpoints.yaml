api_version: "v1"
base_prefix: "/api/v1"
endpoints:
  folder_scaffold:
    base: "/folder-scaffold"
    create_file: "/create-file"
    link_files: "/link-files"
    scaffold_feature: "/scaffold-feature"
    scaffold_package: "/scaffold-package"
  file_search:
    base: "/file-search"
    scan: "/scan"
  code_search:
    base: "/code-search"
    scan: "/scan"
  module_resolver:
    base: "/module-resolver"
    resolve: "/resolve"
  git_verifier:
    base: "/git-verifier"
    verify: "/verify"
  git_remote_inspector:
    base: "/git-remote-inspector"
    search: "/search"
    tree: "/tree"
    branches: "/branches"
    content: "/content"
    diff: "/diff"
    discover_contracts: "/discover-contracts"
    trace_call_chain: "/trace-call-chain"


  git_remote_mutator:
    base: "/git-remote-mutator"
    commit: "/commit"
  git_branch_lifecycle:
    base: "/git-branch-lifecycle"
    create_branch: "/branches"
    merge: "/merge"
    create_repo: "/repositories"
  health:
    base: "/health"
    live: "/health/live"
    ready: "/health/ready"
  system:
    base: ""
    health: "/health"
upstream_services:
  alloydb:
    health_endpoint: "/health"
    timeout_seconds: 5
  neo4j:
    commit_endpoint: "/db/neo4j/tx/commit"
    timeout_seconds: 30
