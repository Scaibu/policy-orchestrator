server:
  host: "127.0.0.1"
  port: 8080

scanner:
  default_root: "."
  max_file_size_mb: 10
  timeout_seconds: 60
  max_concurrent_workers: 4
  ignored_directories:
    - ".git"
    - "node_modules"
    - "dist"
    - "build"
    - ".next"
    - "vendor"
    - "__pycache__"
    - "data"
    - "brain"
    - ".gemini"
    - "scratch"
    - "tmp"
    - "bin"

policy_sync:
  authoritative_contract_path: "policies/rules/edgeCases/algos/agent-operating-contract.md"
  submodule_path: "policies"

database:
  url: "postgresql://alloy_admin:alloysecret@localhost:5432/policy_orchestration"
  pool_size: 10
  timeout_seconds: 5

knowledge_graph:
  backend: "neo4j"
  uri: "http://localhost:7474"
  user: "neo4j"
  password: "policysecret"
  database: "neo4j"
  timeout_seconds: 30

scaffold:
  default_template_version: "v1"
  feature_subdirectories:
    - "schema"
    - "types"
    - "service"
    - "rules"
    - "machines"
    - "workflows"
    - "repository"
    - "queries"
    - "tests"
  package_subdirectories:
    - "contracts"
    - "config"
    - "database"
    - "messaging"
    - "deploy"
    - "src/shared"
    - "src/infra"
    - "src/features"
    - "src/api"
    - "scripts"

github:
  api_base_url: "https://api.github.com"
  token: ""
  timeout_seconds: 30
  max_retries: 3
