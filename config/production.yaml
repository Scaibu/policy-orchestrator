server:
  host: "0.0.0.0"
  port: 8080

scanner:
  default_root: "."
  max_file_size_mb: 25
  timeout_seconds: 120
  max_concurrent_workers: 8
  ignored_directories:
    - ".git"
    - "node_modules"
    - "dist"
    - "build"
    - ".next"
    - "vendor"
    - "__pycache__"
    - "data"
    - "brain"
    - ".gemini"
    - "scratch"
    - "tmp"
    - "bin"

policy_sync:
  authoritative_contract_path: "policies/rules/edgeCases/algos/agent-operating-contract.md"
  submodule_path: "policies"

database:
  url: "postgresql://alloy_admin:alloysecret@alloydb-primary.internal:5432/policy_orchestration"
  pool_size: 25
  timeout_seconds: 10

knowledge_graph:
  backend: "neo4j"
  uri: "bolt://neo4j-cluster.internal:7687"
  user: "neo4j"
  password: "policysecret"
  database: "neo4j"
  timeout_seconds: 60

scaffold:
  default_template_version: "v1"
