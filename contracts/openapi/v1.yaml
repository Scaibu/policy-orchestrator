openapi: 3.1.0
info:
  title: Policy Orchestrator API
  version: 1.0.0
  description: Enterprise-grade REST API for repository invariant auditing, grounded
    hybrid GraphRAG, and autonomous AI Agent orchestration. Strictly conforms to the
    RFC API Request & Response Structure Specification (v5.0).
servers:
- url: http://localhost:8000
  description: Local development orchestrator
paths:
  /api/v1/health:
    get:
      summary: Health Check
      operationId: health_check_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Check Api V1 Health Get
  /api/v1/rag/index:
    post:
      summary: Index Policies
      operationId: index_policies_api_v1_rag_index_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Index Policies Api V1 Rag Index Post
  /api/v1/rag/search:
    post:
      summary: Search Policies
      operationId: search_policies_api_v1_rag_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RAGSearchRequestDTO'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Search Policies Api V1 Rag Search Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/run:
    post:
      summary: Run Agent
      operationId: run_agent_api_v1_agent_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunRequestDTO'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Run Agent Api V1 Agent Run Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents:
    get:
      summary: List Declarative Agents
      operationId: list_declarative_agents_api_v1_agents_get
      parameters:
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Declarative Agents Api V1 Agents Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}/run:
    post:
      summary: Run Specialized Agent
      operationId: run_specialized_agent_api_v1_agents__agent_id__run_post
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunRequestDTO'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Run Specialized Agent Api V1 Agents  Agent Id  Run
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/audit/scan:
    post:
      summary: Scan Repository
      operationId: scan_repository_api_v1_audit_scan_post
      parameters:
      - name: target_directory
        in: query
        required: false
        schema:
          type: string
          default: .
          title: Target Directory
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Scan Repository Api V1 Audit Scan Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/graph/build:
    post:
      summary: Build Graph
      operationId: build_graph_api_v1_graph_build_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Build Graph Api V1 Graph Build Post
  /api/v1/graph/query:
    post:
      summary: Query Graph
      operationId: query_graph_api_v1_graph_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQueryDTO'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Query Graph Api V1 Graph Query Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/graph/impact/{rule_id}:
    get:
      summary: Get Rule Impact
      operationId: get_rule_impact_api_v1_graph_impact__rule_id__get
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          title: Rule Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Rule Impact Api V1 Graph Impact  Rule Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/folder-scaffold/create-file:
    post:
      tags:
      - Folder & File Scaffold
      summary: Create File With Relationship
      operationId: create_file_with_relationship_api_v1_folder_scaffold_create_file_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFileCommand'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/folder-scaffold/link-files:
    post:
      tags:
      - Folder & File Scaffold
      summary: Link Files
      operationId: link_files_api_v1_folder_scaffold_link_files_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkFilesCommand'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/folder-scaffold/scaffold-tree:
    post:
      tags:
      - Folder & File Scaffold
      summary: Scaffold Tree
      operationId: scaffold_tree_api_v1_folder_scaffold_scaffold_tree_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaffoldTreeCommand'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/folder-scaffold/analyze/impact:
    get:
      tags:
      - Folder & File Scaffold
      summary: Analyze Impact
      operationId: analyze_impact_api_v1_folder_scaffold_analyze_impact_get
      parameters:
      - name: target_id
        in: query
        required: true
        schema:
          type: string
          description: Target node ID to evaluate blast radius for
          title: Target Id
        description: Target node ID to evaluate blast radius for
      - name: direction
        in: query
        required: false
        schema:
          type: string
          description: Direction of impact ('upstream' or 'downstream')
          default: upstream
          title: Direction
        description: Direction of impact ('upstream' or 'downstream')
      - name: max_depth
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          description: Max traversal depth in the knowledge graph
          default: 5
          title: Max Depth
        description: Max traversal depth in the knowledge graph
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/folder-scaffold/analyze/lineage:
    get:
      tags:
      - Folder & File Scaffold
      summary: Analyze Lineage
      operationId: analyze_lineage_api_v1_folder_scaffold_analyze_lineage_get
      parameters:
      - name: file_path
        in: query
        required: true
        schema:
          type: string
          description: Absolute or relative file path to trace
          title: File Path
        description: Absolute or relative file path to trace
      - name: max_depth
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          description: Max lineage traversal depth
          default: 5
          title: Max Depth
        description: Max lineage traversal depth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/git-remote-inspector/search:
    post:
      summary: Search Remote Repository Files
      operationId: search_remote_files_api_v1_git_remote_inspector_search_post
      tags:
      - Git Remote Inspector (Zero-Clone Search & Diffs)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchFilesCommand'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
        '400':
          description: Remote Inspection Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
  /api/v1/git-remote-inspector/content:
    post:
      summary: Get Remote File Content
      operationId: get_remote_file_content_api_v1_git_remote_inspector_content_post
      tags:
      - Git Remote Inspector (Zero-Clone Search & Diffs)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetFileContentCommand'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
        '400':
          description: Remote File Content Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
  /api/v1/git-remote-inspector/diff:
    post:
      summary: Get Remote Diff Comparison
      operationId: get_remote_diff_api_v1_git_remote_inspector_diff_post
      tags:
      - Git Remote Inspector (Zero-Clone Search & Diffs)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDiffCommand'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
        '400':
          description: Remote Diff Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
  /api/v1/git-remote-inspector/tree:
    post:
      summary: Get Remote Folder and File Tree Hierarchy
      operationId: get_remote_tree_api_v1_git_remote_inspector_tree_post
      tags:
      - Git Remote Inspector (Zero-Clone Search & Diffs)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetTreeHierarchyCommand'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
        '400':
          description: Remote Tree Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
  /api/v1/git-remote-inspector/branches:
    post:
      summary: List Remote Repository Branches
      operationId: list_remote_branches_api_v1_git_remote_inspector_branches_post
      tags:
      - Git Remote Inspector (Zero-Clone Search & Diffs)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListBranchesCommand'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
        '400':
          description: Remote Branches Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
  /api/v1/git-remote-inspector/discover-contracts:
    post:
      summary: Discover and Prioritize Remote Interface Contracts
      operationId: discover_remote_contracts_api_v1_git_remote_inspector_discover_contracts_post
      tags:
      - Git Remote Inspector (Zero-Clone Search & Diffs)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverContractsCommand'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
        '400':
          description: Discovery Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
  /api/v1/git-remote-inspector/trace-call-chain:
    post:
      summary: Trace Remote Static Call Chain
      operationId: trace_remote_call_chain_api_v1_git_remote_inspector_trace_call_chain_post
      tags:
      - Git Remote Inspector (Zero-Clone Search & Diffs)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraceCallChainCommand'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
  /api/v1/git-remote-inspector/integrate-context:
    post:
      summary: One-Shot Remote Microservice Integration Context
      operationId: integrate_remote_context_api_v1_git_remote_inspector_integrate_context_post
      tags:
      - Git Remote Inspector (Zero-Clone Search & Diffs)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrateContextCommand'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvelope'
components:
  schemas:
    APIResponseEnvelope:
      properties:
        success:
          type: boolean
          title: Success
        statusCode:
          type: integer
          title: Statuscode
        data:
          anyOf:
          - {}
          - type: 'null'
          title: Data
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorContainer'
          - type: 'null'
        errors:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Errors
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      type: object
      required:
      - success
      - statusCode
      - meta
      title: APIResponseEnvelope
    AgentRunRequestDTO:
      properties:
        prompt:
          type: string
          title: Prompt
          description: Task prompt
        target_directory:
          type: string
          title: Target Directory
          default: .
        max_steps:
          type: integer
          title: Max Steps
          default: 10
        temperature:
          type: number
          title: Temperature
          default: 0.0
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
      type: object
      required:
      - prompt
      title: AgentRunRequestDTO
    CreateFileCommand:
      properties:
        path:
          type: string
          title: Path
          description: Target file path
        role:
          type: string
          title: Role
          description: Architectural role
        rel_type:
          type: string
          title: Rel Type
          description: Relationship type
        target:
          type: string
          title: Target
          description: Target node ID or file path
        direction:
          type: string
          title: Direction
          description: 'Relationship direction: outgoing | incoming'
          default: outgoing
        feature_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Feature Name
          description: Feature name
        package_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Package Name
          description: Package name
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
          description: Optional initial file content
      additionalProperties: false
      type: object
      required:
      - path
      - role
      - rel_type
      - target
      title: CreateFileCommand
    ErrorContainer:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        retryable:
          type: boolean
          title: Retryable
          default: false
        details:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Details
      type: object
      required:
      - code
      - message
      title: ErrorContainer
    GraphQueryDTO:
      properties:
        query:
          type: string
          title: Query
          description: Cypher or pattern matching query
        parameters:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Parameters
          description: Query parameters
      type: object
      required:
      - query
      title: GraphQueryDTO
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LinkFilesCommand:
      properties:
        source:
          type: string
          title: Source
          description: Source node ID or file path
        rel_type:
          type: string
          title: Rel Type
          description: Relationship type
        target:
          type: string
          title: Target
          description: Target node ID or file path
        properties:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Properties
          description: Relationship metadata
      additionalProperties: false
      type: object
      required:
      - source
      - rel_type
      - target
      title: LinkFilesCommand
    RAGSearchRequestDTO:
      properties:
        query:
          type: string
          title: Query
          description: Query string
        top_k:
          type: integer
          title: Top K
          description: Top-k documents
          default: 5
        category_filter:
          anyOf:
          - type: string
          - type: 'null'
          title: Category Filter
        min_score:
          type: number
          title: Min Score
          default: 0.0
      type: object
      required:
      - query
      title: RAGSearchRequestDTO
    ResponseMeta:
      properties:
        requestId:
          type: string
          title: Requestid
        correlationId:
          type: string
          title: Correlationid
        causationId:
          anyOf:
          - type: string
          - type: 'null'
          title: Causationid
        timestamp:
          type: string
          title: Timestamp
        executionTimeMs:
          type: integer
          title: Executiontimems
          default: 0
        apiVersion:
          type: string
          title: Apiversion
          default: v1
        status:
          type: string
          title: Status
          default: success
        trace_id:
          type: string
          title: Trace Id
        auditLogId:
          anyOf:
          - type: string
          - type: 'null'
          title: Auditlogid
        operationId:
          anyOf:
          - type: string
          - type: 'null'
          title: Operationid
        deprecatedFields:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Deprecatedfields
        supportedVersions:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Supportedversions
        staleness:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Staleness
        pagination:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Pagination
        links:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Links
      type: object
      required:
      - requestId
      - correlationId
      - timestamp
      - trace_id
      title: ResponseMeta
    ScaffoldTreeCommand:
      properties:
        _template:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Template
          description: Template metadata
        root_id:
          type: string
          title: Root Id
          description: Root package/feature identifier or path
        root_role:
          type: string
          title: Root Role
          description: Role of the root node
          default: PackageRoot
        nodes:
          items:
            $ref: '#/components/schemas/ScaffoldTreeNodeSpec'
          type: array
          title: Nodes
          description: Ordered list of nodes to create
        relationships:
          items:
            $ref: '#/components/schemas/ScaffoldTreeRelationshipSpec'
          type: array
          title: Relationships
          description: Cross-node relationships to link
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: Arbitrary run metadata
      additionalProperties: false
      type: object
      required:
      - root_id
      title: ScaffoldTreeCommand
    ScaffoldTreeNodeSpec:
      properties:
        path:
          type: string
          title: Path
          description: Target file path
        role:
          type: string
          title: Role
          description: Architectural role
        rel_type:
          type: string
          title: Rel Type
          description: Initial relationship type to parent/target
        target:
          type: string
          title: Target
          description: Target node ID or path
        direction:
          type: string
          title: Direction
          description: 'Relationship direction: outgoing | incoming'
          default: outgoing
        feature_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Feature Name
          description: Feature name
        package_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Package Name
          description: Package name
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
          description: Optional initial content
      additionalProperties: false
      type: object
      required:
      - path
      - role
      - rel_type
      - target
      title: ScaffoldTreeNodeSpec
    ScaffoldTreeRelationshipSpec:
      properties:
        source:
          type: string
          title: Source
          description: Source node ID or path
        rel_type:
          type: string
          title: Rel Type
          description: Relationship type
        target:
          type: string
          title: Target
          description: Target node ID or path
        properties:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Properties
          description: Metadata
      additionalProperties: false
      type: object
      required:
      - source
      - rel_type
      - target
      title: ScaffoldTreeRelationshipSpec
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    SearchFilesCommand:
      properties:
        repo_url:
          type: string
          title: Repo Url
        ref_name:
          type: string
          default: main
