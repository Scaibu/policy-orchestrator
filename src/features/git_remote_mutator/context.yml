feature: git_remote_mutator
mode: stateless_hexagonal
version: "1.0.0"

responsibilities:
  - "Mutate specific remote files or directories without local repository cloning"
  - "Generate remote Git blob objects from modified file buffers"
  - "Build Git tree objects reflecting sparse modifications on top of a parent tree SHA"
  - "Create Git commit objects with author attribution, commit message, and parent commit links"
  - "Atomically push and update branch references with optimistic concurrency parent SHA verification"
  - "Support single-file and multi-file transactional atomic commits"
  - "Persist mutation audit ledger records to AlloyDB"

ports:
  driving:
    - name: "GitRemoteMutatorServicePort"
      role: "Driving port exposed to delivery handlers and CLI"
  driven:
    - name: "GitRemoteClientPort"
      role: "Outbound port for remote Git tree, blob, and ref operations"
    - name: "GitRemoteMutatorRepositoryPort"
      role: "AlloyDB SQL persistence port"

inheritance_chain:
  class: "GitRemoteMutatorDomainService"
  parents:
    - "AbstractTracedComponent"
  linearization:
    - "GitRemoteMutatorDomainService"
    - "AbstractTracedComponent"
    - "GitRemoteMutatorServicePort"
    - "ABC"
    - "object"
  shared_ancestors:
    - "AbstractTracedComponent"
  ports:
    driving:
      - "GitRemoteMutatorServicePort"
    driven:
      - "GitRemoteClientPort"
      - "GitRemoteMutatorRepositoryPort"

entities:
  - entity: git_remote_mutation_records
    owner: "@platform-architecture-team"
    fields:
      - name: id                  type: text          null: no   constraint: PK (git_remote_mutation_records_id_pk)
      - name: repo_url           type: text          null: no
      - name: target_branch      type: text          null: no
      - name: parent_commit_sha  type: text          null: no
      - name: new_commit_sha     type: text          null: no
      - name: files_count        type: integer       null: no   default: 1
      - name: commit_message     type: text          null: no
      - name: execution_ms       type: double        null: no   default: 0.0
      - name: created_at         type: timestamptz   null: no   default: NOW()
    invariants:
      - "repo_url must be non-empty"
      - "target_branch must be non-empty"
      - "parent_commit_sha and new_commit_sha must be valid 40-character SHAs"
      - "files_count must be at least 1"
    pii: [none]
    source_of_truth: db
