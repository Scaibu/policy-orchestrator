feature: git_remote_inspector
mode: stateless_hexagonal
version: "1.0.0"

responsibilities:
  - "Inspect and traverse remote Git repositories without local cloning"
  - "Search and filter file and directory paths matching glob patterns across branches and commit SHAs"
  - "Fetch raw file blob contents, encoding, and metadata for specific paths"
  - "Generate unified diffs between commits, branches, or tree snapshots"
  - "Inspect commit DAG history, commit author attribution, and ref state"
  - "Persist remote inspection audit ledger records to AlloyDB"

ports:
  driving:
    - name: "GitRemoteInspectorServicePort"
      role: "Driving port exposed to delivery handlers and CLI"
  driven:
    - name: "GitRemoteClientPort"
      role: "Outbound port for remote Git tree, blob, and ref operations"
    - name: "GitRemoteInspectorRepositoryPort"
      role: "AlloyDB SQL persistence port"

inheritance_chain:
  class: "GitRemoteInspectorDomainService"
  parents:
    - "AbstractTracedComponent"
  linearization:
    - "GitRemoteInspectorDomainService"
    - "AbstractTracedComponent"
    - "GitRemoteInspectorServicePort"
    - "ABC"
    - "object"
  shared_ancestors:
    - "AbstractTracedComponent"
  ports:
    driving:
      - "GitRemoteInspectorServicePort"
    driven:
      - "GitRemoteClientPort"
      - "GitRemoteInspectorRepositoryPort"

entities:
  - entity: git_remote_inspection_records
    owner: "@platform-architecture-team"
    fields:
      - name: id             type: text          null: no   constraint: PK (git_remote_inspection_records_id_pk)
      - name: repo_url      type: text          null: no
      - name: ref_name      type: text          null: no
      - name: path_pattern  type: text          null: yes
      - name: total_found   type: integer       null: no   default: 0
      - name: execution_ms  type: double        null: no   default: 0.0
      - name: created_at    type: timestamptz   null: no   default: NOW()
    invariants:
      - "repo_url must be non-empty"
      - "ref_name must be non-empty"
      - "total_found is never negative"
    pii: [none]
    source_of_truth: db
