feature: file_search
mode: stateless_hexagonal
version: "1.0.0"

responsibilities:
  - "Traverse directory hierarchies via recursive DFS/BFS traversal algorithms"
  - "Prune ignored branches (.git, __pycache__, node_modules) efficiently"
  - "Cache inode metadata in-memory for sub-millisecond repeated queries"
  - "Persist search records to AlloyDB ledger for auditability"

ports:
  driving:
    - name: "FileSearchServicePort"
      role: "Driving port exposed to delivery handlers and CLI"
  driven:
    - name: "FileSearchRepositoryPort"
      role: "AlloyDB SQL persistence port"

inheritance_chain:
  class: "FileSearchDomainService"
  parents:
    - "AbstractTracedComponent"
  linearization:
    - "FileSearchDomainService"
    - "AbstractTracedComponent"
    - "FileSearchServicePort"
    - "ABC"
    - "object"
  shared_ancestors:
    - "AbstractTracedComponent"
  ports:
    driving:
      - "FileSearchServicePort"
    driven:
      - "FileSearchRepositoryPort"

entities:
  - entity: file_search_records
    owner: "@platform-architecture-team"
    fields:
      - name: id             type: text          null: no   constraint: PK (file_search_records_id_pk)
      - name: root_path      type: text          null: no
      - name: total_found    type: integer       null: no   default: 0
      - name: execution_ms   type: double        null: no   default: 0.0
      - name: created_at     type: timestamptz   null: no   default: NOW()
    invariants:
      - "total_found is never negative"
      - "root_path must be non-empty"
    pii: [none]
    source_of_truth: db
