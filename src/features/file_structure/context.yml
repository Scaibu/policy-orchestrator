domain: "file_structure"
description: "File Structure Scaffolding, Architectural Rule Validation, and Knowledge Graph Dependency Subsystem"
version: "1.0.0"

responsibilities:
  - "Automated Directory and File Scaffolding: Generates isolated feature and package structures per architectural standards"
  - "Ingress Route and Handler Scaffolding: Automates creation and registration of dedicated REST routers and handlers"
  - "Hexagonal Port and Adapter Governance: Manages local vs shared repository ports, adapters, and DI container bindings"
  - "Graph Dependency Sync: Instantly connects file nodes and directed hexagonal edges in the Architectural Knowledge Graph"
  - "Bi-Directional Impact Traversal: Evaluates upstream reachability closures and downstream blast radius risk scores"

dependencies:
  inbound:
    - "src/api/rest/v1/handlers/file_structure_handler.py"
    - "CI/CD automated file structure regression and audit scripts"
  outbound:
    - "src/domain/ports/impact_analysis_port.py"
    - "src/features/file_structure/repository/file_structure_repository_port.py"
  cross_feature: "NONE - interacts via public interfaces and domain events only"

architecture_topology_diagram: |
  ========================================================================================================================
                                     TIER 1: CONTRACT SPECIFICATIONS (contracts/)
  ========================================================================================================================
  [ OpenAPI Contract: contracts/openapi/{f}.v1.yaml ] ────────────────────────────────────────┐
  [ GraphQL Schema: contracts/graphql/{f}.graphql ] ────────────────────────┐                 │
  [ gRPC Proto: contracts/proto/v1/{f}.proto ] ───────────┐                 │                 │
  [ AsyncAPI Spec: contracts/asyncapi/{f}.v1.yaml ] ──┐   │                 │                 │
                                                      │   │                 │                 │
  ====================================================│===│=================│=================│===========================
                           TIER 2: INGRESS DELIVERY ADAPTERS (src/api/)       │                 │
  ====================================================│===│=================│=================│===========================
                                                      │   │                 │   [:DEFINES_ROUTE]
                                                      │   │                 │                 │
                                                      │   │                 │                 ▼
                                                      │   │                 │   [ REST Router: src/api/rest/v1/routers/{f}_router.py ]
                                                      │   │                 │                 │
                                                      │   │                 │                 ├─[:EVALUATES_ROUTE_RULES]─► [ Route Rules: src/api/rest/v1/route.rules/{f}_route_rules.py ]
                                                      │   │                 │                 │
                                                      │   │                 │                 ▼ [:DELEGATES_TO]
                                                      │   │                 │   [ REST Handler: src/api/rest/v1/handlers/{f}_handler.py ]
                                                      │   │                 │                 │
                                                      │   │                 │                 ├─[:INVOKES_ACL]─► [ Schema ACL: schema/{f}_schema.py ]
                                                      │   │                 │                 │
                                                      │   │                 │                 ▼ [:INVOKES_DOMAIN]
                                                      │   │                 │          ┌──────────────────────────────────────────────┐
                                                      │   │   [:DEFINES_GRPC]          │                                              │
                                                      │   │                 ▼          │                                              │
                                                      │   │   [ gRPC Server Handler ]  │                                              │
                                                      │   │                 │          │                                              │
                                                      │   │  [:DISPATCHES_GRPC]        │                                              │
                                                      │   └─────────────────┼─────────►│                                              │
                                                      │                     │          │                                              │
                                                      │   [:DEFINES_GRAPHQL]▼          │                                              │
                                                      │       [ GraphQL Resolver ]     │                                              │
                                                      │                     │          │                                              │
                                                      │      [:RESOLVES_TO] └─────────►│                                              │
                                                      │                                │                                              │
  ====================================================│================================│==============================================
                    TIER 3: FEATURE DOMAIN CORE (src/features/{feature-name}/)         │
  ====================================================│================================│==============================================
  [ Context: context.yml ] ──────────[:GOVERNS_BOUNDARY]──────────────────────────────►│ [ Pure Domain Service: service/{f}_service.py ]
  [ Public Facade: index.py ] ───────[:EXPORTS_FACADE]────────────────────────────────►│                                              │
                                                                                       │                                              │
         ┌─────────────────────────────────────────────────────────────────────────────┼──────────────────────────────────────────────┤
         │                                                                             │                                              │
         ▼ [:TYPED_BY]                                                                 ▼ [:ENFORCES_RULES]                            │
  [ Domain Types: types/{f}_types.py ] ──[:TYPED_BY]──► [ Schema ACL ]          [ Business Rules: rules/{f}_rules.py ]                 │
                                                                                       │                                              │
                                                                                       ▼ [:TRANSITIONS_STATE]                         │
                                                                                [ State Machine: machines/{f}_machine.py ]             │
                                                                                       │                                              │
                                                                                       ▼ [:RUNS_WORKFLOW]                             │
                                                                                [ Workflow DAG: workflows/{f}_workflow.py ]           │
                                                                                       │                                              │
                                                                                       ▼ [:CONSUMES_PORT]                             │
                                                                                [ Repository Port: repository/{f}_repository_port.py ] │
                                                                                       │                                              │
                                                                                       ▼ [:IMPLEMENTED_BY]                            │
                                                                                [ Repository Adapter: repository/{f}_repository.py ]   │
                                                                                       │                                              │
                                                                                       ▼ [:EXECUTES_QUERY]                            │
                                                                                [ Flow Queries: queries/{f}.queries.sql ]              │
                                                                                       │                                              │
  =====================================================================================│==============================================
                 TIER 4: PERSISTENCE, MESSAGING, INFRASTRUCTURE & SHARED               │
  =====================================================================================│==============================================
                                                                                       │
  [ Flow Queries ] ──[:DEPENDS_ON_DDL]──► [ DB Migrations: database/migrations/ ]      │
                                                     │                                 │
                                            [:LOCKED_BY]                               │
                                                     ▼                                 │
                                          [ database/schema.lock ]                     │
                                                                                       │
  [ Repository Adapter ] ──[:ACQUIRES_CONNECTION]──► [ DB Pool: src/infra/database/pool/connection_pool.py ]
                                                                                       │
  [ Domain Service ] ──[:EMITS_EVENT]──► [ Event Producer: src/infra/messaging/producers/{f}_event_producer.py ]
                                                     │
                                               [:PUBLISHES_TO]
                                                     ▼
  [ AsyncAPI Spec ] ──[:SPECIFIES_ASYNC]──► [ Kafka Topic: messaging/topics/0001_create_{f}_events.json ]
                                                     │
                                            ┌────────┴────────────────────────┬─────────────────────────────────┐
                                            │                                 │                                 │
                                       [:LOCKED_BY]                     [:FALLBACK_DLQ]                   [:DELIVERS_TO]
                                            ▼                                 ▼                                 ▼
                                 [ messaging/topics.lock ]        [ Dead Letter Queue: dlq/ ]      [ Event Consumer: src/api/events/ ]
                                                                                                                │
                                                                                                       [:TRIGGERS_DOMAIN]
                                                                                                                ▼
                                                                                                   [ Pure Domain Service ] ◄──┘
                                                                                                                │
  [ Domain Service ] ──[:IMPORTS_SHARED]──► [ Shared Utilities: src/shared/utils/formatters.py ]
  [ Domain Service ] ──[:CONFIGURED_BY]──► [ Configuration Schema: config/env.schema ]
  [ Domain Service ] ──[:TRACED_BY]──────► [ OpenTelemetry Tracer: src/infra/observability/tracing/tracer.py ]
  [ Domain Service ] ◄─[:TESTS_COMPONENT]── [ Test Suite: tests/features/{f}_test.py ]

entities:
  scaffold_templates:
    owner: "@platform-architecture-team"
    source_of_truth: db
    fields:
      - name: id             type: text          null: no   constraint: PK, UNIQUE, immutable
      - name: template_type  type: text          null: no   constraint: CHECK (template_type IN ('FEATURE', 'PACKAGE'))
      - name: version        type: text          null: no   constraint: length 1..32
      - name: directories    type: jsonb         null: no   constraint: CHECK (jsonb_typeof(directories) = 'array')
      - name: files          type: jsonb         null: no   constraint: CHECK (jsonb_typeof(files) = 'array')
      - name: metadata       type: jsonb         null: no   default: '{}'
      - name: is_active      type: boolean       null: no   default: true
      - name: created_at     type: timestamptz   null: no   default: now()
      - name: updated_at     type: timestamptz   null: no   default: now()

  scaffolded_features:
    owner: "@platform-architecture-team"
    source_of_truth: db
    fields:
      - name: feature_name   type: text          null: no   constraint: PK, UNIQUE, length 1..128
      - name: target_dir     type: text          null: no   constraint: length 1..512
      - name: port_type      type: text          null: no   default: 'local'
      - name: files          type: jsonb         null: no   constraint: CHECK (jsonb_typeof(files) = 'array')
      - name: metadata       type: jsonb         null: no   default: '{}'
      - name: created_at     type: timestamptz   null: no   default: now()

  scaffolded_packages:
    owner: "@platform-architecture-team"
    source_of_truth: db
    fields:
      - name: package_name   type: text          null: no   constraint: PK, UNIQUE, length 1..128
      - name: target_root    type: text          null: no   constraint: length 1..512
      - name: directories    type: jsonb         null: no   constraint: CHECK (jsonb_typeof(directories) = 'array')
      - name: files          type: jsonb         null: no   constraint: CHECK (jsonb_typeof(files) = 'array')
      - name: metadata       type: jsonb         null: no   default: '{}'
      - name: created_at     type: timestamptz   null: no   default: now()
