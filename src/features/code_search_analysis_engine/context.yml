domain: "code_search_analysis_engine"
description: "Stateless hexagonal core and domain orchestrator for Code Search, Multi-Pattern AST Scanning, Zero-Inline-Comment Compliance, and Static Code Analysis"
version: "1.0.0"

responsibilities:
  - "Multi-pattern substring, regex, and AST code search across repository workspaces"
  - "Zero-Inline-Comment Doctrine linter and metric compliance auditing"
  - "Cyclomatic complexity, parameter count, and function length boundary enforcement"
  - "Hexagonal decoupling through abstract ports and resilient adapters"

inheritance_chain:
  class: "CodeSearchAnalysisEngineService"
  parents:
    - "AbstractTracedComponent"
    - "AbstractDomainService"
  linearization:
    - "CodeSearchAnalysisEngineService"
    - "AbstractDomainService"
    - "AbstractTracedComponent"
    - "object"
  shared_ancestors:
    - "AbstractTracedComponent"
  ports:
    - "CodeSearchAnalysisEngineServicePort"
    - "CodeSearchAnalysisEngineRepositoryPort"

dependencies:
  inbound:
    - "src/api/rest/v1/routers/code_search_analysis_engine_router.py"
    - "src/api/rest/v1/handlers/code_search_analysis_engine_handler.py"
  outbound:
    - "src/features/code_search_analysis_engine/repository/code_search_analysis_engine_repository_port.py"
  cross_feature: "NONE - interacts via public interfaces and domain ports only"
